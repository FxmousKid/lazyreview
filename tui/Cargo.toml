[package]
name = "lazyreview"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A Vim-driven GitHub PR review terminal with explicit AI context"

[dependencies]
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "=0.29.0"
serde_json = "1"
regex = "1"
serde_yaml_ng = "=0.10.0"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
tempfile = "3"
syntect = { version = "=5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
libc = "0.2"
portable-pty = "0.9"
vt100 = "0.16"
scraper = "0.25"

[profile.release]
strip = true
lto = "thin"
